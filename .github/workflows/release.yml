name: Release

# On main: Changesets opens (or updates) a "Version Packages" pull request from the pending
# changesets. Merging that PR bumps the plugin's version and changelog, and this workflow then
# publishes it to npm with provenance. See docs/releasing.md.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test lint build --filter=sanity-plugin-writing-room...
      - uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          # Publishing stays off until the repository variable NPM_PUBLISH is "true" (and the
          # NPM_TOKEN secret is set), so the Version Packages PR works before npm is set up.
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          title: Release sanity-plugin-writing-room
          commit: Release sanity-plugin-writing-room
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
